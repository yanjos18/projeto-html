<!DOCTYPE html>
<html>

<head>
    <title>Pet Lar</title>

    <style>
        body {
            font-family: Arial;
        }

        h1 {
            color: #55bda3;
        }

        button {
            background-color: #55bda3;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>🐾 Pet Lar</h1>

    <h2>ENCONTRE UM LAR.</h2>

    <h3>MUDE UMA VIDA</h3>

    <p>
        Encontre um pet para adotar
        e dê a ele um novo lar.
    </p>

    <button>ENCONTRE UM PET</button>

    <h2>Pets disponíveis</h2>

    <h3>TOM</h3>
    <img src="tom.png" width="100">
    <p>2 anos - São Paulo</p>

    <h3>LUNA</h3>
    <img src="luna.png" width="100">
    <p>1 ano - São Paulo</p>

    <hr>

    <h2>Buscar Pet</h2>

    <input type="text" placeholder="Nome do pet">

    <button>Buscar</button>

    <h2>Quero adotar</h2>

    <input type="text" placeholder="Nome">
    <br><br>

    <input type="email" placeholder="E-mail">
    <br><br>

    <input type="text" placeholder="Telefone">
    <br><br>

    <button>Enviar</button>

</body>

</html>
